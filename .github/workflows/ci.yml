name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # File discovery walks the filesystem, and that is where platform and
    # runtime differences show up: an earlier version returned zero files on
    # macOS with Node 24 while passing every test on Linux with Node 22. One
    # platform in CI proves less than it looks like it does.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/dist/*.test.js

      # Dogfooding. The product's whole argument is that this gate belongs in
      # CI, so it runs here against a fixture project with a committed
      # baseline. If a change to the rules moves a number, this fails — which
      # is exactly what it would do in a user's repo.
      - name: Census gate on the v22 fixture
        run: |
          node packages/cli/dist/bin.js check fixtures/v22-project \
            --baseline fixtures/v22-project.baseline.json \
            --strict
